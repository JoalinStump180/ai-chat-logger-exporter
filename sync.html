<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Manual sync</title>
  <style>
    body { font: 13px/1.4 "Segoe UI", sans-serif; margin: 0; background: #f6f6f6; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #fff; border-bottom: 1px solid #ccc; }
    #meta { padding: 8px 12px; color: #555; font-size: 12px; }
    #rows { background: #fff; }
    .item { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: start; padding: 8px 12px; border-bottom: 1px solid #eee; }
    .item .title { word-break: break-word; }
    .item .url { color: #666; font-size: 11px; }
    .st { min-width: 140px; text-align: right; color: #333; font-size: 12px; }
    .st.ok { color: #0a7; }
    .st.err { color: #c22; }
    .st.run { color: #06c; }
    footer { padding: 10px 12px; display: flex; gap: 8px; }
    button { font: 13px "Segoe UI", sans-serif; padding: 4px 10px; }
  </style>
</head>
<body>
  <header>
    <b>Manual sync</b>
    <button type="button" id="closeBtn">Close</button>
  </header>
  <div id="meta">Detecting chats on the current tab…</div>
  <div id="rows"></div>
  <footer>
    <button type="button" id="logBtn">Log selected</button>
    <label><input type="checkbox" id="overwriteText" /> Overwrite ask# / ans# text for the same uid</label>
    <span id="foot"></span>
  </footer>
  <script src="sync.js"></script>
</body>
</html>
